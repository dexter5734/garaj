<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Garaj</title>
<link rel="manifest" href="data:application/json,{%22name%22:%22Garaj%22,%22display%22:%22standalone%22,%22background_color%22:%22%230a0a0c%22}">
<meta name="theme-color" content="#0a0a0c">
<style>
  :root{
    --bg:#0a0a0c;--card:#141418;--card2:#1c1c22;--bd:#232329;--bd2:#33333c;
    --fg:#f5f5f7;--mut:#82828e;--pri:#f43f5e;--ok:#22c55e;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--fg);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:calc(18px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom));
    max-width:440px;margin:0 auto;letter-spacing:-.01em;
  }
  h1{font-size:30px;margin:0;letter-spacing:-.05em;font-weight:800}
  h2{font-size:15px;margin:0 0 10px;font-weight:700;letter-spacing:-.02em}
  .sub{font-size:11.5px;color:var(--mut);margin-top:3px}
  .row{display:flex;gap:8px}
  button{border:0;border-radius:11px;padding:13px;font-size:14px;font-weight:650;cursor:pointer;font-family:inherit;transition:transform .12s,opacity .12s}
  button:active{transform:scale(.975)}
  button:disabled{opacity:.45;pointer-events:none}
  .pri{background:var(--pri);color:#fff;flex:1;box-shadow:0 6px 20px -8px var(--pri)}
  .sec{background:var(--card2);color:var(--fg);flex:1;border:1px solid var(--bd)}
  .ghost{background:none;color:var(--mut);font-weight:500;font-size:12.5px;padding:9px}
  input,select{width:100%;background:#0d0d10;border:1px solid var(--bd);border-radius:11px;padding:12px 13px;color:var(--fg);font-size:14px;margin-bottom:8px;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--bd2)}
  input::placeholder{color:#5c5c66}

  .hero{background:linear-gradient(155deg,#17171c 0%,#101014 60%);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:16px 0 14px}
  .hero .lbl{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);font-weight:700}
  .hero .big{font-size:29px;font-weight:800;letter-spacing:-.045em;margin:2px 0 0}
  .hero .line{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--mut)}
  .hero .line b{color:var(--fg);font-weight:650}

  .scan{border-radius:18px;padding:24px 16px;text-align:center;background:var(--card);border:1px solid var(--bd);position:relative;overflow:hidden}
  .scan::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(244,63,94,.13),transparent 65%);pointer-events:none}
  .ic{width:46px;height:46px;margin:0 auto 12px;border-radius:13px;background:#22222a;border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:19px}
  .scan .t{font-weight:700;font-size:16.5px;letter-spacing:-.025em;position:relative}
  #msg2{font-size:11.5px;color:var(--mut);margin-top:9px;min-height:15px}

  .chips{display:flex;gap:6px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:transparent;border:1px solid var(--bd);color:var(--mut);font-size:11.5px;font-weight:600;padding:7px 12px;border-radius:99px}
  .chip.on{background:var(--fg);color:#0a0a0c;border-color:var(--fg)}

  .item{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:10px;margin-bottom:7px;cursor:pointer;transition:border-color .15s}
  .item:active{border-color:var(--bd2)}
  .thumb{width:46px;height:46px;border-radius:10px;flex:0 0 auto;object-fit:cover;background:linear-gradient(140deg,#26262e,#17171c);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#4a4a55}
  .nm{font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.015em}
  .meta{font-size:10.5px;color:var(--mut);font-family:ui-monospace,SFMono-Regular,monospace;margin-top:3px}
  .price{font-size:11px;margin-top:3px;color:var(--mut)}
  .price b{color:var(--fg);font-weight:650}
  .badge{font-size:8.5px;font-weight:800;padding:4px 6px;border-radius:6px;white-space:nowrap;letter-spacing:.05em}
  .empty{text-align:center;color:var(--mut);font-size:12.5px;padding:40px 20px;line-height:1.6}

  .sk{background:linear-gradient(90deg,#141418 25%,#1d1d23 50%,#141418 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--r);height:68px;margin-bottom:7px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
  #backdrop.on{opacity:1;pointer-events:auto}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#101013;border-top:1px solid var(--bd2);border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.32,.72,0,1);max-height:92vh;overflow-y:auto;max-width:440px;margin:0 auto}
  #sheet.on{transform:translateY(0)}
  .grab{width:36px;height:4px;background:#3a3a44;border-radius:99px;margin:0 auto 14px}
  .prev{width:100%;height:150px;object-fit:cover;border-radius:13px;margin-bottom:11px;background:#1a1a20}
  .warn{background:#2a1a10;border:1px solid #4a3018;color:#f0a860;font-size:11.5px;padding:9px 11px;border-radius:10px;margin-bottom:10px}

  #toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#f5f5f7;color:#0a0a0c;font-size:12.5px;font-weight:650;padding:10px 16px;border-radius:99px;opacity:0;transition:.2s;z-index:60;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #toast.err{background:var(--pri);color:#fff}

  #auth{max-width:300px;margin:60px auto}
  .hidden{display:none}
</style>
</head>
<body>

<div id="auth">
  <h1>Garaj</h1>
  <p class="sub">Koleksiyonun, değeri, her yerde.</p>
  <div style="height:22px"></div>
  <input id="email" type="email" placeholder="e-posta" autocomplete="email" inputmode="email">
  <button class="pri" style="width:100%" onclick="login()">Giriş bağlantısı gönder</button>
  <div class="sub" id="msg" style="margin-top:12px;min-height:16px"></div>
</div>

<div id="app" class="hidden">
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div>
      <h1>Garaj</h1>
      <div class="sub" id="sub">0 araç</div>
    </div>
    <button class="ghost" onclick="logout()">çıkış</button>
  </div>

  <div class="hero">
    <div class="lbl">Koleksiyon değeri</div>
    <div class="big" id="vVal">—</div>
    <div class="line"><span>Ödenen <b id="vPaid">—</b></span><span>Fark <b id="vDiff">—</b></span></div>
  </div>

  <div class="scan">
    <div class="ic">◎</div>
    <div class="t">Kartı tara</div>
    <div class="sub" style="margin:5px 0 14px;position:relative">Kod, isim ve nadirlik okunur</div>
    <div class="row" style="position:relative">
      <button class="pri" onclick="cam.click()">Kamera</button>
      <button class="sec" onclick="gal.click()">Galeri</button>
    </div>
    <button class="ghost" style="width:100%;margin-top:9px;position:relative" onclick="openSheet()">elle ekle</button>
    <div id="msg2"></div>
  </div>

  <div class="chips" id="chips"></div>
  <input id="q" placeholder="ara" oninput="paint()" style="margin:10px 0">
  <div id="list"></div>

  <div class="row" style="margin-top:14px">
    <button class="sec" style="font-size:12px;padding:10px" onclick="csv()">CSV indir</button>
    <button class="sec" style="font-size:12px;padding:10px" onclick="logout()">Çıkış</button>
  </div>
</div>

<div id="backdrop" onclick="closeSheet()"></div>
<div id="sheet">
  <div class="grab"></div>
  <h2 id="sheetTitle">Yeni kayıt</h2>
  <img id="prev" class="prev hidden" alt="">
  <div id="warn" class="warn hidden"></div>
  <input id="fCode" placeholder="oyuncak kodu (JJM17)" autocapitalize="characters" autocomplete="off">
  <input id="fName" placeholder="araç adı" autocomplete="off">
  <input id="fBrand" placeholder="marka" autocomplete="off">
  <div class="row" style="margin-bottom:8px">
    <input id="fPaid" type="number" inputmode="decimal" placeholder="ödediğin ₺">
    <input id="fVal" type="number" inputmode="decimal" placeholder="değeri ₺">
  </div>
  <select id="fRar">
    <option value="mainline">mainline</option>
    <option value="th">treasure hunt</option>
    <option value="sth">super th</option>
    <option value="chase">chase</option>
    <option value="premium">premium</option>
  </select>
  <div class="row" style="margin-top:6px">
    <button class="pri" id="fSave" onclick="save()">Kaydet</button>
    <button class="sec" style="flex:0;padding:13px 18px" onclick="closeSheet()">İptal</button>
  </div>
</div>

<div id="toast"></div>
<input id="cam" type="file" accept="image/*" capture="environment" class="hidden">
<input id="gal" type="file" accept="image/*" class="hidden">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const GKEY = "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";
const MODELS = ["meta-llama/llama-4-scout-17b-16e-instruct", "qwen/qwen3-vl-32b-instruct"];
const db = supabase.createClient(
  "https://cczusdudetcqshdzvchn.supabase.co",
  "sb_publishable_XJnMlPrus-TcKhdyN_W0hQ_MPaY1vHw"
);

const RAR = {
  mainline: ["","#82828e"],
  th: ["TH","#f59e0b"],
  sth: ["STH","#f43f5e"],
  chase: ["CHASE","#a855f7"],
  premium: ["PREM","#14b8a6"]
};
const $ = id => document.getElementById(id);
const tl = n => (n || 0).toLocaleString("tr-TR") + " ₺";
const esc = s => String(s ?? "").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };

let rows = [], me = null, imgs = {}, filter = "all", editId = null, pending = null, busy = false;

function toast(msg, err){
  const t = $("toast");
  t.textContent = msg;
  t.className = "on" + (err ? " err" : "");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = "", 2400);
}

db.auth.onAuthStateChange((_e, s) => {
  me = s?.user || null;
  $("auth").classList.toggle("hidden", !!me);
  $("app").classList.toggle("hidden", !me);
  if (me) load();
});

async function login(){
  const email = $("email").value.trim();
  if (!email) return;
  $("msg").textContent = "gönderiliyor…";
  const { error } = await db.auth.signInWithOtp({
    email, options: { emailRedirectTo: location.origin + location.pathname }
  });
  $("msg").textContent = error ? error.message : "Bağlantı gönderildi. Kopyala, bu sekmeye yapıştır.";
}

const logout = () => db.auth.signOut();

async function load(){
  $("list").innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  const { data, error } = await db.from("garage").select("*").order("created_at", { ascending: false });
  if (error) { $("sub").textContent = error.message; $("list").innerHTML = ""; return; }
  rows = data || [];

  const paths = rows.map(r => r.photo_path).filter(Boolean);
  if (paths.length){
    const { data: signed } = await db.storage.from("photos").createSignedUrls(paths, 3600);
    (signed || []).forEach(s => { if (s.signedUrl && s.path) imgs[s.path] = s.signedUrl; });
  }
  paint();
}

function openSheet(rec){
  editId = rec?.id || null;
  pending = null;
  $("sheetTitle").textContent = rec ? "Düzenle" : "Yeni kayıt";
  $("fCode").value = rec?.toy_number || "";
  $("fName").value = rec?.name || "";
  $("fBrand").value = rec?.brand || "";
  $("fPaid").value = rec?.paid || "";
  $("fVal").value = rec?.valuation || "";
  $("fRar").value = rec?.rarity || "mainline";
  $("warn").classList.add("hidden");
  $("prev").classList.add("hidden");
  if (rec?.photo_path && imgs[rec.photo_path]){
    $("prev").src = imgs[rec.photo_path];
    $("prev").classList.remove("hidden");
  }
  $("backdrop").classList.add("on");
  $("sheet").classList.add("on");
  if (!rec) setTimeout(() => $("fCode").focus(), 320);
}

function closeSheet(){
  $("backdrop").classList.remove("on");
  $("sheet").classList.remove("on");
  editId = null; pending = null;
}

async function save(){
  const code = $("fCode").value.trim().toUpperCase();
  const name = $("fName").value.trim();
  if (!code && !name) { toast("kod veya isim gerekli", true); return; }
  if (!editId && code && rows.some(r => r.toy_number === code)) { toast("zaten garajında", true); buzz(40); return; }

  $("fSave").disabled = true;
  try {
    let photo_path = editId ? rows.find(r => r.id === editId)?.photo_path : null;
    if (pending){
      const p = `${me.id}/${crypto.randomUUID()}.jpg`;
      const { error } = await db.storage.from("photos").upload(p, pending, { contentType: "image/jpeg" });
      if (!error) photo_path = p;
    }
    const payload = {
      toy_number: code, name: name || code, brand: $("fBrand").value.trim(),
      rarity: $("fRar").value,
      paid: +$("fPaid").value || 0,
      valuation: +$("fVal").value || 0,
      photo_path
    };
    const res = editId
      ? await db.from("garage").update(payload).eq("id", editId)
      : await db.from("garage").insert({ ...payload, user_id: me.id });
    if (res.error) throw res.error;
    buzz(25);
    toast(editId ? "güncellendi" : "kaydedildi");
    closeSheet();
    load();
  } catch (e) {
    toast(String(e.message).slice(0, 40), true);
  } finally {
    $("fSave").disabled = false;
  }
}

async function del(id, ev){
  ev.stopPropagation();
  if (!confirm("Silinsin mi?")) return;
  const rec = rows.find(r => r.id === id);
  await db.from("garage").delete().eq("id", id);
  if (rec?.photo_path) db.storage.from("photos").remove([rec.photo_path]);
  rows = rows.filter(r => r.id !== id);
  buzz(15); toast("silindi"); paint();
}

function paint(){
  const tv = rows.reduce((s,r) => s + (+r.valuation || 0), 0);
  const tp = rows.reduce((s,r) => s + (+r.paid || 0), 0);
  $("vVal").textContent = tv ? tl(tv) : "—";
  $("vPaid").textContent = tp ? tl(tp) : "—";
  const d = $("vDiff");
  d.textContent = (tv || tp) ? ((tv - tp) >= 0 ? "+" : "") + tl(tv - tp) : "—";
  d.style.color = tv - tp > 0 ? "var(--ok)" : tv - tp < 0 ? "var(--pri)" : "var(--fg)";
  $("sub").textContent = rows.length + " araç";

  const counts = { all: rows.length };
  rows.forEach(r => counts[r.rar] = (counts[r.rar] || 0) + 1);
  $("chips").innerHTML = [["all","tümü"],["sth","STH"],["th","TH"],["chase","chase"],["premium","prem"],["mainline","main"]]
    .filter(([k]) => k === "all" || counts[k])
    .map(([k,lab]) => `<button class="chip ${filter === k ? "on" : ""}" onclick="setFilter('${k}')">${lab}${k !== "all" ? " " + counts[k] : ""}</button>`)
    .join("");

  const q = $("q").value.toLowerCase();
  const shown = rows.filter(r =>
    (filter === "all" || r.rar === filter) &&
    (!q || (r.name + " " + (r.toy_number || "") + " " + (r.brand || "")).toLowerCase().includes(q))
  );

  const el = $("list");
  if (!shown.length){
    el.innerHTML = `<div class="empty">${rows.length ? "sonuç yok" : "Henüz kayıt yok.<br>Bir kart tara ya da elle ekle."}</div>`;
    return;
  }
  el.innerHTML = shown.map(r => {
    const b = RAR[r.rar] || RAR.mainline;
    const src = r.photo_path && imgs[r.photo_path];
    const thumb = src
      ? `<img class="thumb" src="${esc(src)}" loading="lazy" alt="">`
      : `<div class="thumb">${esc((r.name || "?").slice(0,1))}</div>`;
    return `<div class="item" onclick="edit('${r.id}')">
      ${thumb}
      <div style="flex:1;min-width:0">
        <div class="nm">${esc(r.name)}</div>
        <div class="meta">${esc(r.toy_number || "—")}${r.brand ? " · " + esc(r.brand) : ""} · ${r.created_at.slice(0,10)}</div>
        ${(r.paid || r.valuation) ? `<div class="price">ödenen <b>${tl(r.paid)}</b> · değer <b>${tl(r.valuation)}</b></div>` : ""}
      </div>
      ${b[0] ? `<span class="badge" style="background:${b[1]}22;color:${b[1]}">${b[0]}</span>` : ""}
      <button class="ghost" style="font-size:18px;padding:0 2px" onclick="del('${r.id}', event)">×</button>
    </div>`;
  }).join("");
}

const setFilter = f => { filter = f; paint(); };
const edit = id => { const r = rows.find(x => x.id === id); if (r) openSheet(r); };

function csv(){
  if (!rows.length) return toast("boş");
  const head = "kod,ad,marka,nadirlik,odenen,deger,tarih\n";
  const body = rows.map(r => [r.toy_number, r.name, r.brand, r.rar, r.paid, r.valuation, r.created_at.slice(0,10)]
    .map(v => `"${String(v ?? "").replace(/"/g,'""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + head + body], { type: "text/csv" }));
  a.download = "garaj.csv"; a.click();
}

function shrink(file, max){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onerror = rej;
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      const x = c.getContext("2d");
      x.filter = "contrast(1.12) saturate(1.05)";
      x.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.9).split(",")[1]);
    };
    img.src = URL.createObjectURL(file);
  });
}

const PROMPT = `Bir 1:64 diecast oyuncak araba kartı fotoğrafı. Kartı dikkatle oku.
Kurallar:
- "code": kartın alt kenarındaki oyuncak numarası (2-3 harf + 2-4 rakam, ör. JJM17, HKJ44, MB1201). Görünmüyorsa "".
- "name": araç modeli, BÜYÜK HARF, marka adı olmadan (ör. NISSAN SKYLINE GT-R, FERRARI F40).
- "brand": Hot Wheels, Matchbox, Mini GT, Kaido House, Majorette veya "".
- "rarity": kartta "Super Treasure Hunt" veya altın TH logosu -> "sth"; "Treasure Hunt" -> "th"; "Chase" -> "chase"; Premium/Collector/Boulevard serisi -> "premium"; diğer -> "mainline".
- "confidence": 0-100, kodu ne kadar net okuduğun.
Küçük hukuki metinleri ve büyük logo yazısını isim sanma.
Sadece JSON döndür.`;

async function scan(file){
  if (busy) return;
  busy = true;
  $("msg2").textContent = "okunuyor…";
  openSheet();
  $("sheetTitle").textContent = "Okunuyor…";
  $("fSave").disabled = true;
  try {
    const b64 = await shrink(file, 1100);
    let lastErr = "okunamadı";
    let t = null;

    for (const model of MODELS){
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + GKEY },
        body: JSON.stringify({
          model,
          temperature: 0.1,
          response_format: { type: "json_object" },
          messages: [{
            role: "user",
            content: [
              { type: "text", text: PROMPT },
              { type: "image_url", image_url: { url: "data:image/jpeg;base64," + b64 } }
            ]
          }]
        })
      });
      const j = await res.json();
      if (res.ok) { t = JSON.parse(j.choices[0].message.content); break; }
      lastErr = j.error?.message || "istek hatası";
      if (!/model|decommission|not found/i.test(lastErr)) break;
    }
    if (!t) throw new Error(lastErr);

    $("fCode").value = (t.code || "").toUpperCase().replace(/\s/g, "");
    $("fName").value = (t.name || "").toUpperCase();
    $("fBrand").value = t.brand || "";
    $("fRar").value = RAR[t.rarity] ? t.rarity : "mainline";
    pending = file;
    $("prev").src = URL.createObjectURL(file);
    $("prev").classList.remove("hidden");
    $("sheetTitle").textContent = "Yeni kayıt";

    if ((t.confidence || 0) < 55 || !t.name){
      $("warn").textContent = "Okuma zayıf — kodu ve ismi kontrol et. Kartı düz, dolu çerçevede çek.";
      $("warn").classList.remove("hidden");
    } else if (t.code && rows.some(r => r.toy_number === t.code)){
      $("warn").textContent = "Bu kod zaten garajında.";
      $("warn").classList.remove("hidden");
    }
    buzz(20);
    $("msg2").textContent = "okundu";
    $("fPaid").focus();
  } catch (e) {
    $("sheetTitle").textContent = "Yeni kayıt";
    $("warn").textContent = "Okunamadı: " + String(e.message).slice(0, 50) + " — elle girebilirsin.";
    $("warn").classList.remove("hidden");
    pending = file;
    $("prev").src = URL.createObjectURL(file);
    $("prev").classList.remove("hidden");
    $("msg2").textContent = "elle tamamla";
  } finally {
    $("fSave").disabled = false;
    busy = false;
  }
}

for (const id of ["cam","gal"]) $(id).onchange = e => {
  const f = e.target.files[0];
  if (f) scan(f);
  e.target.value = "";
};
</script>
</body>
</html>
